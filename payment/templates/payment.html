{% extends "base.html" %}
{% block content %}

<h2>Make Payment</h2>

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="phone"
        placeholder="2547XXXXXXXX"
        required
    >

    <br><br>

    <input
        type="number"
        name="amount"
        required
    >

    <br><br>

    <button type="submit">
        Pay Now
    </button>

</form>

{% endblock %}
